name: Flexible Multi-Target CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select Deployment Target'
        required: true
        default: 'catalyst'
        type: choice
        options:
          - 'docker-only'
          - 'catalyst'
          - 'vercel'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # STAGE 1: CI Code Quality & Build Verification
  ci-quality-check:
    name: CI Safety and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cicd-react-app/package-lock.json

      - name: Install & Build Check
        run: |
          cd cicd-react-app
          npm ci || npm install
          npm run build

  # STAGE 2: Standalone Docker Build & Push
  build-and-push-docker:
    name: Build & Push Docker Image
    needs: ci-quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'docker-only'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./cicd-react-app
          file: ./cicd-react-app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}

  # STAGE 3: Deploy to Catalyst AppSail
  deploy-to-catalyst:
    name: Deploy Container to Zoho Catalyst AppSail
    needs: ci-quality-check
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'catalyst') ||
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build Docker image and push to GHCR
      - name: Build Docker Image Locally & Push GHCR
        run: |
          docker build -t ghcr.io/${{ env.REPO_LOWER }}:latest ./cicd-react-app
          docker push ghcr.io/${{ env.REPO_LOWER }}:latest

      # 2. Deploy to Catalyst
      - name: Deploy to Catalyst AppSail
        run: |
          npm install -g zcatalyst-cli
          catalyst deploy --token ${{ secrets.CATALYST_TOKEN }} --project 31902000002215215 --org 905328786

      # 3. Post-Deployment Instructions
      - name: Production Promotion Notice
        run: |
          echo "=========================================================="
          echo " SUCCESS: Deployed latest container to Catalyst!"
          echo " Catalyst Console: https://console.catalyst.zoho.com/baas/905328786/project/31902000002215215/Production#/serverless/appsail/31902000002208788/deployment"
          echo " To promote live to Production: Open the link above and click 'Create Deployment'."
          echo "=========================================================="