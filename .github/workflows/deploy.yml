name: Universal Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select Deployment Target'
        required: true
        default: 'docker'
        type: choice
        options:
          - 'docker'
          - 'vercel'
          - 'catalyst'
          - 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-quality-check:
    name: CI Automated Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Detect Repository Structure & Install Dependencies
        run: |
          if [ -d "client" ] && [ -d "server" ]; then
            echo "Monorepo detected. Installing dependencies for both client and server..."
            cd client && npm ci || npm install
            cd ../server && npm ci || npm install
          else
            echo "Single project detected. Installing root dependencies..."
            npm ci || npm install
          fi

      - name: Run Build Verification
        run: |
          if [ -d "client" ]; then
            cd client && npm run build
          elif [ -f "package.json" ] && grep -q "\"build\":" "package.json"; then
            npm run build
          else
            echo "No build script found, skipping build step."
          fi

  docker-build-and-publish:
    name: CD Build & Publish Container Images
    needs: ci-quality-check
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') || 
      (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'docker' || inputs.deploy_target == 'all'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Monorepo Frontend Image
        if: hashFiles('client/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}

      - name: Build & Push Monorepo Backend Image
        if: hashFiles('server/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}

      - name: Build & Push Root Project Image
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  deploy-to-vercel:
    name: CD Vercel Production Deployment
    needs: ci-quality-check
    runs-on: ubuntu-latest
    if: |
      secrets.VERCEL_TOKEN != '' && (
        startsWith(github.ref, 'refs/tags/v') || 
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'vercel' || inputs.deploy_target == 'all'))
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  deploy-to-catalyst:
    name: CD Zoho Catalyst AppSail Deployment
    needs: ci-quality-check
    runs-on: ubuntu-latest
    if: |
      secrets.CATALYST_TOKEN != '' && (
        startsWith(github.ref, 'refs/tags/v') || 
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'catalyst' || inputs.deploy_target == 'all'))
      )

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Catalyst CLI & Deploy
        run: |
          npm install -g zcatalyst-cli
          catalyst deploy --token ${{ secrets.CATALYST_TOKEN }}