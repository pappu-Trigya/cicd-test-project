name: Dynamic Branch CI/CD Pipeline

# Trigger on pushes or PRs to ANY branch
on:
  push:
    branches:
      - '**'          # Matches every branch (main, dev, feature/xyz, hotfix/*)
  pull_request:
    branches:
      - '**'

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Build (Runs for ALL branches and PRs)
  # -------------------------------------------------------------
  test-and-build:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Automated Tests
        run: npm test

      - name: Build Artifacts
        run: npm run build

      # Save built output so deployment job can use it
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  # -------------------------------------------------------------
  # JOB 2: Dynamic Deployment (Deploys based on active branch)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Target Environment
    needs: test-and-build
    runs-on: ubuntu-latest
    
    # Do not deploy on Pull Requests (only run tests/build)
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      # Extract current branch name into an environment variable
      - name: Get Branch Name
        run: echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # Target Environment Routing Logic
      # ---------------------------------------------------------
      
      # Case 1: MAIN / MASTER -> Deploy to Production
      - name: Deploy to PRODUCTION (Main/Master Branch)
        if: env.BRANCH_NAME == 'main' || env.BRANCH_NAME == 'master'
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          echo "🚀 Deploying branch [${{ env.BRANCH_NAME }}] to PRODUCTION..."
          # Catalyst / AWS Deploy Command for Production:
          # npm install -g zcatalyst-cli && catalyst deploy --token $CATALYST_TOKEN

      # Case 2: STAGING / DEV -> Deploy to Staging Environment
      - name: Deploy to STAGING (Dev/Staging Branch)
        if: env.BRANCH_NAME == 'staging' || env.BRANCH_NAME == 'dev'
        run: |
          echo "🧪 Deploying branch [${{ env.BRANCH_NAME }}] to STAGING environment..."

      # Case 3: FEATURE / ANY OTHER BRANCH -> Preview Deployment
      - name: Deploy PREVIEW (Feature Branches)
        if: env.BRANCH_NAME != 'main' && env.BRANCH_NAME != 'master' && env.BRANCH_NAME != 'staging' && env.BRANCH_NAME != 'dev'
        run: |
          echo "🔍 Deploying feature branch [${{ env.BRANCH_NAME }}] to PREVIEW environment..."