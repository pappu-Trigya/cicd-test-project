server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Serve React Single Page Application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Dynamic Reverse Proxy for API
    # Route all calls from /api/ directly to backend without CORS restrictions
    location /api/ {
        proxy_pass http://127.0.0.1:8000/; # Passes to Express server dynamically
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}